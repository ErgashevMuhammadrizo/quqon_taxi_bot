# Alembic konfiguratsiya fayli
# Ishlatish: alembic upgrade head

[alembic]
# Migration skriptlar joylashuvi
script_location = alembic

# Migratsiya fayl nomi formati: YYYY-MM-DD_HHMM_slug
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# .env fayldan DATABASE_URL o'qiladi (alembic/env.py ichida)
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# hooks.post_write_hooks (ixtiyoriy: black yoki ruff formatlash uchun)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
